  <!-- CTA Box -->
  <rect x="20" y="420" width="300" height="60" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <text x="40" y="445" font-family="Arial" font-size="11" fill="#5b21b6" font-weight="600">📋 Screenshot real de cliente</text>
  <text x="40" y="465" font-family="Arial" font-size="11" fill="#7c3aed">Reemplazar con export Salesforce</text>
