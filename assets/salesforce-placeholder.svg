  <text x="40" y="380" font-family="Arial" font-size="12" fill="#1e293b">Luis Fernández</text>
  <text x="200" y="380" font-family="Arial" font-size="12" fill="#10b981" font-weight="bold">● 5/5</text>
  <text x="300" y="380" font-family="Arial" font-size="12" fill="#5b21b6">Hot_Lead</text>
  <text x="450" y="380" font-family="Arial" font-size="12" fill="#64748b">4 matching Retiro</text>
