  <rect x="20" y="315" width="760" height="40" fill="#ffffff" stroke="#e9d5ff"/>
  <rect x="20" y="315" width="5" height="40" fill="#f59e0b"/>
  <text x="40" y="340" font-family="Arial" font-size="12" fill="#1e293b">Ana Martínez</text>
  <text x="200" y="340" font-family="Arial" font-size="12" fill="#f59e0b" font-weight="bold">● 4/5</text>
  <text x="300" y="340" font-family="Arial" font-size="12" fill="#5b21b6">Warm_Lead</text>
  <text x="450" y="340" font-family="Arial" font-size="12" fill="#64748b">2 matching Centro</text>
