  <rect x="590" y="115" width="180" height="70" fill="#ffffff" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="610" y="140" font-family="Arial" font-size="11" fill="#5b21b6" font-weight="600">ROI</text>
